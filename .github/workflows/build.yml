name: build
# Manual trigger only: run it after the repository is public, so the package
# inherits public visibility and the Classroom 50 runner can pull it.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amrita-school-of-ai/hpc-cuda-grader:13.0
            ghcr.io/amrita-school-of-ai/hpc-cuda-grader:latest
